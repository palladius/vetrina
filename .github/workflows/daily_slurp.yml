name: "🔄 Daily Cron: Slurp Federated Vetrina Metadata"

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 03:00 UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  slurp:
    name: 📥 Slurp Remote vetrina.json & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 🔄 Run Slurper Engine
        run: |
          python3 bin/slurp_vetrina.py

      - name: 🚀 Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(slurp): 🔄 federated update from remote vetrina.json"
            git push origin main
          else
            echo "✨ No remote updates found. Working tree clean."
          fi
